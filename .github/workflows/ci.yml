name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.action != 'closed'
    # Public repository: GitHub-hosted runners are free.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level critical
      - run: pnpm typecheck
      - run: pnpm build
      - name: Offline tests (mock upstream, no API key)
        timeout-minutes: 8
        run: pnpm test
      - name: Docker image starts and lists tools over stdio without a key
        timeout-minutes: 5
        run: |
          docker build -t valyu-mcp:ci .
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 docker run --rm -i --network none valyu-mcp:ci > out.jsonl
          python3 - <<'PY'
          import json
          msgs = [json.loads(line) for line in open("out.jsonl") if line.strip()]
          tools = sorted(t["name"] for m in msgs if m.get("id") == 2 for t in m["result"]["tools"])
          assert len(tools) == 6, tools
          print("tools:", ", ".join(tools))
          PY
